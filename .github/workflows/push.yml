name: PHP Tests

on: [push, pull_request]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        symfony: ['6.4.*', '7.4.*']
        include:
          - symfony: '6.4.*'
            type_info_constraint: ''
          - symfony: '7.4.*'
            type_info_constraint: '--with symfony/type-info:7.4.*'

    env:
      REDIS_DSN: redis://u:password123@127.0.0.1:6379?queue=messenger
      SYMFONY_REDIS_DSN: redis://password123@127.0.0.1:6379
      SYMFONY_DEPRECATIONS_HELPER: max[total]=0

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none
          tools: composer:v2
      - name: Start Redis
        run: |
          docker run --detach --name messenger-redis --publish 6379:6379 redis:7-alpine redis-server --requirepass password123
          until docker exec messenger-redis redis-cli -a password123 ping; do sleep 1; done
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: >-
          composer update --prefer-dist --no-interaction --no-progress
          --with symfony/cache:${{ matrix.symfony }}
          --with symfony/clock:${{ matrix.symfony }}
          --with symfony/config:${{ matrix.symfony }}
          --with symfony/dependency-injection:${{ matrix.symfony }}
          --with symfony/error-handler:${{ matrix.symfony }}
          --with symfony/event-dispatcher:${{ matrix.symfony }}
          --with symfony/filesystem:${{ matrix.symfony }}
          --with symfony/finder:${{ matrix.symfony }}
          --with symfony/framework-bundle:${{ matrix.symfony }}
          --with symfony/http-foundation:${{ matrix.symfony }}
          --with symfony/http-kernel:${{ matrix.symfony }}
          --with symfony/messenger:${{ matrix.symfony }}
          --with symfony/phpunit-bridge:${{ matrix.symfony }}
          --with symfony/property-access:${{ matrix.symfony }}
          --with symfony/property-info:${{ matrix.symfony }}
          --with symfony/redis-messenger:${{ matrix.symfony }}
          --with symfony/routing:${{ matrix.symfony }}
          --with symfony/serializer:${{ matrix.symfony }}
          --with symfony/string:${{ matrix.symfony }}
          ${{ matrix.type_info_constraint }}
          --with symfony/var-dumper:${{ matrix.symfony }}
          --with symfony/var-exporter:${{ matrix.symfony }}
          --with symfony/yaml:${{ matrix.symfony }}
      - name: Run tests without deprecations
        run: composer test
